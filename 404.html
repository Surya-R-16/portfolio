<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex">
<link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F5F2E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="https://ascii.rest/ascii.js"></script>
<style>
  :root{--paper:#F5F2E8;--ink:#111;--blue:#0000EE;--line:#111}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;
       min-height:100vh;display:flex;flex-direction:column}
  nav{border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 22px;font-size:12px;font-weight:700}
  nav a{color:var(--ink);text-decoration:none;margin-left:16px}
  nav a:hover{color:var(--blue);text-decoration:underline}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 22px;text-align:center}
  .plate{border:2px solid var(--line);background:#fff;padding:14px 18px;overflow:hidden}
  .plate ascii-art{color:var(--blue);display:block;font-size:11px;line-height:1.15}
  .hand{font-family:Caveat,cursive;font-size:20px;color:var(--blue)}
  .links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .links a{border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:12px;padding:5px 14px}
  .links a:hover{background:var(--blue);border-color:var(--blue);color:#fff}
  footer{border-top:2px solid var(--line);padding:16px 22px;text-align:center;font-size:11px;color:#555}
  @media(max-width:520px){.plate ascii-art{font-size:6.5px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><div><b>SURYA-R-16</b> — FIELD NOTES</div>
<div><a href="/portfolio/">HOME</a><a href="/portfolio/#work">WORK</a><a href="/portfolio/#contact">CONTACT</a></div></nav>

<main>
  <div class="plate">
    <ascii-art piece="not-found" mono
      label="404 — no such plate. The page you asked for is filed elsewhere, or was never printed."
      options='{"code":"404","title":"no such plate","message":"filed elsewhere, or never printed"}'></ascii-art>

  <div class="links">
    <a href="/portfolio/#work">SEE THE WORK →</a>
